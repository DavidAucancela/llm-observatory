[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-observatory"
version = "1.0.0"
description = "Drop-in observability wrapper for Anthropic, OpenAI, Gemini (Google), Grok (xAI), Kimi (Moonshot AI), and DeepInfra Python SDKs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "observability", "anthropic", "openai", "gemini", "google", "grok", "xai", "kimi", "moonshot", "deepinfra", "monitoring", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
gemini = ["google-genai>=1.0.0"]
# Grok (xAI), Kimi (Moonshot AI) and DeepInfra all expose an OpenAI-compatible API,
# so MonitoredGrok/MonitoredKimi/MonitoredDeepInfra reuse the openai package under a custom base_url —
# these extras are aliases of the same dependency for clearer install intent.
# (Gemini is not OpenAI-compatible, so its extra above is a real dependency, not an alias.)
grok = ["openai>=1.0.0"]
kimi = ["openai>=1.0.0"]
deepinfra = ["openai>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/DavidAucancela/llm-observatory"
Repository = "https://github.com/DavidAucancela/llm-observatory"

[tool.hatch.build.targets.wheel]
packages = ["llm_observatory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
